<div class="login-page">

    <!-- Left decorative panel (hidden on mobile) -->
    <div class="login-hero d-none d-lg-flex">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <div class="hero-icon">
                <i class="ri-star-fill"></i>
            </div>
            <h1>Ranjha<span>7star</span></h1>
            <p>Internet Service Provider Management System</p>
            <div class="hero-features">
                <div class="hero-feature">
                    <i class="ri-shield-check-line"></i>
                    <span>Secure Access</span>
                </div>
                <div class="hero-feature">
                    <i class="ri-speed-line"></i>
                    <span>Real-time Monitoring</span>
                </div>
                <div class="hero-feature">
                    <i class="ri-customer-service-2-line"></i>
                    <span>Customer Management</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Right login form panel -->
    <div class="login-form-panel">
        <div class="login-card">

            <!-- Mobile brand (visible only on small screens) -->
            <div class="mobile-brand d-lg-none">
                <i class="ri-star-fill"></i>
                <span>Ranjha<strong>7star</strong></span>
            </div>

            <div class="login-header">
                <h2>Welcome back</h2>
                <p>Sign in to your account to continue</p>
            </div>

            <form (ngSubmit)="login()" class="login-form">

                <div class="form-field">
                    <label for="username">
                        <i class="ri-user-line"></i> Username
                    </label>
                    <div class="input-wrap">
                        <input
                            id="username"
                            type="text"
                            [(ngModel)]="username"
                            name="username"
                            placeholder="Enter your username"
                            autocomplete="username"
                            required
                        />
                    </div>
                </div>

                <div class="form-field">
                    <label for="password">
                        <i class="ri-lock-line"></i> Password
                    </label>
                    <div class="input-wrap">
                        <input
                            id="password"
                            [type]="showPassword ? 'text' : 'password'"
                            [(ngModel)]="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        />
                        <button
                            type="button"
                            class="toggle-password"
                            (click)="togglePassword()"
                            tabindex="-1"
                        >
                            <i [class]="showPassword ? 'ri-eye-off-line' : 'ri-eye-line'"></i>
                        </button>
                    </div>
                </div>

                <button
                    type="submit"
                    class="login-btn"
                    [disabled]="loading"
                    [class.loading]="loading"
                >
                    <span *ngIf="!loading">
                        Sign In
                        <i class="ri-arrow-right-line"></i>
                    </span>
                    <span *ngIf="loading" class="d-flex align-items-center justify-content-center gap-2">
                        <span class="spinner-border spinner-border-sm"></span>
                        Signing in...
                    </span>
                </button>

            </form>

            <div *ngIf="errorMessage" class="error-msg">
                <i class="ri-error-warning-line"></i>
                {{ errorMessage }}
            </div>

            <div class="login-footer">
                <small>Powered by Ranjha7star Cable Network</small>
            </div>

        </div>
    </div>

</div>
