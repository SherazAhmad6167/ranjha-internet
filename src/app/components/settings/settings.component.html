<div class=" mt-4">
  <h3 class="mb-4">SMS Templates Settings</h3>

  <div class="row">
    <div class="col-md-6 mb-4" *ngFor="let item of templates">

      <div class="card shadow-sm">
        <div class="card-header d-flex justify-content-between">
          <strong>{{ item.title }}</strong>
        </div>

        <div class="card-body">

          <!-- TEXTAREA -->
          <textarea class="form-control mb-3"
                    rows="6"
                    [(ngModel)]="item.message">
          </textarea>

          <!-- BUTTONS -->
          <div class="d-flex gap-2">
            <button class="btn btn-success btn-sm"
                    (click)="saveTemplate(item)">
              Save
            </button>

            <button class="btn btn-warning btn-sm"
                    (click)="resetTemplate(item)">
              Reset
            </button>

            <button class="btn btn-danger btn-sm"
                    (click)="deleteTemplate(item.id)">
              Delete
            </button>
          </div>

        </div>
      </div>

    </div>
  </div>
</div>


<button class="mt-4" (click)="sendTestSMS()">Send SMS</button>
