<div class=" mt-4">
  <h3 class="mb-4">SMS Templates Settings</h3>

  <div class="row">
    <div class="col-md-6 mb-4" *ngFor="let item of templates">

      <div class="card shadow-sm">
        <div class="card-header d-flex justify-content-between">
          <strong>{{ item.title }}</strong>
        </div>

        <div class="card-body">

          <!-- TEXTAREA -->
          <textarea class="form-control mb-3"
                    rows="6"
                    [(ngModel)]="item.message">
          </textarea>

          <!-- BUTTONS -->
          <div class="d-flex gap-2">
            <button class="btn btn-success btn-sm"
                    (click)="saveTemplate(item)">
              Save
            </button>

            <button class="btn btn-warning btn-sm"
                    (click)="resetTemplate(item)">
              Reset
            </button>

            <button class="btn btn-danger btn-sm"
                    (click)="deleteTemplate(item.id)">
              Delete
            </button>
          </div>

        </div>
      </div>

    </div>
  </div>
</div>

<div class="container mt-4">

  <div class="row">

    <!-- ✅ Single SMS Form -->
    <div class="col-md-6">
      <div class="card shadow-sm p-3">
        <h5 class="mb-3 text-primary">📩 Send Single SMS</h5>

        <form [formGroup]="singleSMSForm">

          <!-- Phone -->
          <div class="mb-3">
            <label class="form-label">Phone Number</label>
            <input
              type="text"
              class="form-control"
              formControlName="phone"
              placeholder="+923001234567">

            <small class="text-muted">
              Format: +923XXXXXXXXX (include country code)
            </small>
          </div>

          <!-- Message -->
          <div class="mb-3">
            <label class="form-label">Message</label>
            <textarea
              class="form-control"
              rows="3"
              formControlName="message"
              placeholder="Type your message..."></textarea>
          </div>

          <!-- Button -->
          <div class="d-grid">
            <button
              class="btn btn-primary"
              (click)="sendSingleSMS()">
              Send SMS
            </button>
          </div>

        </form>
      </div>
    </div>


    <!-- ✅ Bulk SMS Form -->
    <div class="col-md-6">
      <div class="card shadow-sm p-3">
        <h5 class="mb-3 text-danger">📢 Send Bulk SMS</h5>

        <form [formGroup]="bulkSMSForm">

          <!-- Numbers -->
          <div class="mb-3">
            <label class="form-label">Phone Numbers</label>

            <textarea
              class="form-control"
              rows="4"
              formControlName="phones"
              placeholder="+923001234567, +923009876543"></textarea>

            <small class="text-muted">
              Enter multiple numbers:<br>
              ✔ Comma separated OR new line<br><br>

              Example:<br>
              +923001234567, +923009876543<br>
              OR<br>
              +923001234567<br>
              +923009876543
            </small>
          </div>

          <!-- Message -->
          <div class="mb-3">
            <label class="form-label">Message</label>
            <textarea
              class="form-control"
              rows="3"
              formControlName="message"
              placeholder="Type your message..."></textarea>
          </div>

          <!-- Button -->
          <div class="d-grid">
            <button
              class="btn btn-danger"
              (click)="sendBulkSMS()">
              Send Bulk SMS
            </button>
          </div>

        </form>
      </div>
    </div>

  </div>
</div>
